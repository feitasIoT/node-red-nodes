<script type="text/javascript">
    RED.nodes.registerType('odoo-update', {
        category: "odoo",
        defaults: {
            name: { value: "" },
            host: { value: "", type: "odoo-config" },
            model: { value: "", required: true },
            payloadSource: { value: "payload", required: false },
            filter: { value: "", required: false },
            offset: {value: 0, required: false },
            limit: {value: 100, required: false }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-pencil",
        color: "#D8BFD8",
        label: function () {
            return this.name || "odoo-update"
        }
    });
</script>

<script type="text/x-red" data-template-name="odoo-update">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
         <label for="node-input-host"><i class="icon-bookmark"></i> URL</label>
         <input type="text" id="node-input-host">
     </div>
     <div class="form-row">
         <label for="node-input-model"><i class="icon-"></i> Model</label>
         <input type="text" id="node-input-model">
     </div>
     <div class="form-row">
         <label for="node-input-payloadSource"><i class="icon-tag"></i> Payload Source</label>
         <input type="text" id="node-input-payloadSource" placeholder="payload (or values / msg.values)">
     </div>
</script>

<script type="text/x-red" data-help-name="odoo-update">
    <p>Calls the 'update' method on Odoo using the given model.</p>
    <p>Example 1: msg.payload = [[7940], {"name": "test write"}]</p>
    <p>Example 2: msg.payload = {"id": 7940, "name": "test write"}</p>
</script>
